name: Deploy Teamost Website

on:
  push:
    branches: ['master']

env:
  REGISTRY: crpi-1rw5u2cpo17otwz5.cn-hangzhou.personal.cr.aliyuncs.com
  NAMESPACE: nick2806844715
  IMAGE_NAME: teamost-website
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nick2806844715
          password: Ghh15377167407.

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
